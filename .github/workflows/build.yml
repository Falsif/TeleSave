name: Сборка TeleSave

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Сборка EXE и установщика
        run: python build.py

      - name: Загрузить установщик
        uses: actions/upload-artifact@v4
        with:
          name: TeleSave-Setup
          path: output/*.exe

      - name: Версия
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from telesave.paths import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: TeleSave ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            Скачайте **TeleSave-Setup-${{ steps.ver.outputs.v }}.exe** ниже и запустите.
            Если Windows покажет «Неизвестный издатель» — «Подробнее» → «Выполнить в любом случае».
          files: output/*.exe
